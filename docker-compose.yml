services:
  app:
    build: ./src
    container_name: app-practica7
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: practica7
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-practica7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: practica7
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: